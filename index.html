<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 電腦螢幕評分與排名系統</title>
    <!-- 引入外部樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部頁首 -->
    <header class="site-header">
        <h1>🖥️ 2026 電腦螢幕智慧評分系統</h1>
        <p>即時匯總價格、尺寸、銷量與大數據評分排行</p>
    </header>

    <!-- 主體區塊 -->
    <main class="container">
        
        <!-- 工具操作列 -->
        <section class="filter-bar">
            <div class="filter-group">
                <!-- 尺寸條件篩選 -->
                <div class="filter-item">
                    <label>螢幕大小</label>
                    <select id="sizeFilter" onchange="filterAndRenderMonitors()">
                        <option value="all">全部尺寸</option>
                        <option value="24">24 吋</option>
                        <option value="27">27 吋</option>
                        <option value="32">32 吋</option>
                        <option value="34">34 吋以上</option>
                    </select>
                </div>
                <!-- 排序條件設定 -->
                <div class="filter-item">
                    <label>排序依據</label>
                    <select id="sortBy" onchange="filterAndRenderMonitors()">
                        <option value="rank">2026 綜合排名</option>
                        <option value="price_asc">價格：由低到高</option>
                        <option value="price_desc">價格：由高到低</option>
                        <option value="sales">銷量：由高到低</option>
                        <option value="score">系統評分：由高到低</option>
                    </select>
                </div>
            </div>
            <div class="filter-tip">💡 系統評分演算法：綜合解析度、更新率、面板與價格權衡計算。</div>
        </section>

        <!-- 數據卡片容器 -->
        <section id="monitorList" class="monitor-grid">
            <p class="status-msg">數據載入中...</p>
        </section>
    </main>

    <!-- 前端核心控制腳本 -->
    <script>
        // 設定相對路徑以相容 GitHub Pages 靜態環境讀取
        const DATA_URL = './data.json'; 
        let rawMonitorsData = []; 

        // 非同步讀取 JSON 數據源
        async function fetchInitialData() {
            const monitorList = document.getElementById('monitorList');
            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
                }
                rawMonitorsData = await response.json();
                // 成功取得資料後，執行第一次畫面渲染
                filterAndRenderMonitors(); 
            } catch (error) {
                console.error("無法成功獲取 JSON 數據:", error);
                monitorList.innerHTML = `
                    <p class="status-msg" style="color: #f43f5e;">
                        數據加載失敗！請確認 data.json 是否正確與 index.html 放置於相同 GitHub 倉庫目錄中。
                    </p>`;
            }
        }

        // 負責前端即時過濾、排序與卡片生成
        function filterAndRenderMonitors() {
            const selectedSize = document.getElementById('sizeFilter').value;
            const selectedSort = document.getElementById('sortBy').value;
            const monitorList = document.getElementById('monitorList');
            
            // 淺拷貝數據源防止破壞原始陣列
            let processedList = [...rawMonitorsData];

            // 1. 執行螢幕尺寸過濾
            if (selectedSize !== 'all') {
                if (selectedSize === '34') {
                    processedList = processedList.filter(item => item.size >= 34);
                } else {
                    processedList = processedList.filter(item => item.size === parseInt(selectedSize));
                }
            }

            // 2. 執行動態條件排序
            if (selectedSort === 'rank') {
                processedList.sort((a, b) => a.rank_2026 - b.rank_2026);
            } else if (selectedSort === 'price_asc') {
                processedList.sort((a, b) => a.price - b.price);
            } else if (selectedSort === 'price_desc') {
                processedList.sort((a, b) => b.price - a.price);
            } else if (selectedSort === 'sales') {
                processedList.sort((a, b) => b.sales - a.sales);
            } else if (selectedSort === 'score') {
                processedList.sort((a, b) => b.system_score - a.system_score);
            }

            // 3. 處理無符合結果防呆
            if (processedList.length === 0) {
                monitorList.innerHTML = '<p class="status-msg">沒有找到符合當前篩選條件的螢幕機型</p>';
                return;
            }

            // 4. 生成並插入 HTML 結構
            monitorList.innerHTML = processedList.map(monitor => `
                <div class="monitor-card">
                    <!-- 2026 排名圖章 -->
                    <div class="rank-badge">2026 排名 #${monitor.rank_2026}</div>
                    
                    <!-- 產品核心規格資訊 -->
                    <div class="card-body">
                        <h3 class="card-title" title="${monitor.name}">${monitor.name}</h3>
                        <p class="card-subtitle">${monitor.panel} | ${monitor.resolution} | ${monitor.refresh_rate}</p>
                        
                        <div class="specs-badge-container">
                            <div class="spec-item">
                                <span>尺寸</span>
                                <span class="spec-size">${monitor.size} 吋</span>
                            </div>
                            <div class="spec-item">
                                <span>月銷量</span>
                                <span class="spec-sales">${monitor.sales.toLocaleString()} 筆</span>
                            </div>
                            <div class="spec-item">
                                <span>系統評分</span>
                                <span class="spec-score">${monitor.system_score} / 100</span>
                            </div>
                        </div>
                    </div>

                    <!-- 價格與操作按鈕 -->
                    <div class="card-footer">
                        <div class="price-box">
                            <span>促銷價</span>
                            <span class="price-value">NT$ ${monitor.price.toLocaleString()}</span>
                        </div>
                        <button class="btn-detail" onclick="alert('正在前往 ${monitor.name} 的詳細評測頁面...')">
                            查看評測
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 頁面初始化載入
        window.onload = fetchInitialData;
    </script>
</body>
</html>
