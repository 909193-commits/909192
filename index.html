<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 全球電腦螢幕智慧評分系統</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        header h1 {
            margin-bottom: 10px;
        }

        /* 篩選與排序控制區 */
        .controls-panel {
            background: var(--card-background);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
        }

        .control-group select, .control-group input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .control-group select:focus, .control-group input:focus {
            border-color: var(--primary-color);
        }

        /* 螢幕卡片列表 */
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .monitor-card {
            background: var(--card-background);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .monitor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        /* 2026 排名標籤 */
        .rank-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f59e0b;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            z-index: 10;
        }

        .monitor-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .monitor-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0f172a;
            line-height: 1.4;
        }

        .specs-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag {
            background: #f1f5f9;
            color: #475569;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .data-label {
            color: #64748b;
        }

        .data-value {
            font-weight: 600;
        }

        /* 智慧評分系統樣式 */
        .score-box {
            background: #eff6ff;
            border: 1px dashed #bfdbfe;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
        }

        .score-title {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--secondary-color);
        }

        .price-highlight {
            color: #ef4444;
            font-size: 1.1rem;
        }
    </style>
</head>

    /**
     * 核心演算法：系統智慧綜合評分計算
     * 邏輯：考慮銷量(30%)、價格高低C/P值(30%)、專家評測硬體分(40%)進行加權計算，滿分10分
     */
    function calculateSystemScore(monitor) {
        // 1. 銷量評分 (以最高銷量 5200 台為基準進行常態化)
        const salesScore = (monitor.monthlySales / 5200) * 10;
        
        // 2. 價格性價比評分 (價格越低，基礎高CP分越高；此處採對數反向計算)
        let priceScore = 10 - (monitor.price / 50000) * 10;
        if(priceScore < 2) priceScore = 2; // 給予基本分

        // 3. 專家評分
        const expertScore = monitor.expertReviewScore;

        // 加權總分
        const totalScore = (salesScore * 0.3) + (priceScore * 0.3) + (expertScore * 0.4);
        return totalScore.toFixed(1);
    }
