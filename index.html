<script>
    // 讀取與 index.html 放在同一個 GitHub 倉庫下的 data.json
    const API_URL = './data.json'; 
    let allMonitors = []; // 用來儲存從 JSON 載入的原始數據

    // 網頁載入時，先去抓取一次 JSON 資料
    async function loadData() {
        try {
            const response = await fetch(API_URL);
            allMonitors = await response.json();
            // 載入完畢後，執行第一次的渲染
            fetchMonitors(); 
        } catch (error) {
            console.error("無法取得 JSON 數據:", error);
            document.getElementById('monitorList').innerHTML = 
                '<p class="status-msg" style="color: #f43f5e;">無法載入數據，請確認 data.json 是否上傳成功。</p>';
        }
    }

    // 負責處理前端篩選、排序與畫面渲染的函數
    function fetchMonitors() {
        const sizeFilter = document.getElementById('sizeFilter').value;
        const sortBy = document.getElementById('sortBy').value;
        const monitorList = document.getElementById('monitorList');
        
        // 1. 複製一份資料進行處理，避免污染原始數據
        let displayData = [...allMonitors];

        // 2. 在前端執行尺寸篩選
        if (sizeFilter !== 'all') {
            if (sizeFilter === '34') {
                displayData = displayData.filter(m => m.size >= 34);
            } else {
                displayData = displayData.filter(m => m.size === parseInt(sizeFilter));
            }
        }

        // 3. 在前端執行動態排序
        if (sortBy === 'rank') {
            displayData.sort((a, b) => a.rank_2026 - b.rank_2026);
        } else if (sortBy === 'price_asc') {
            displayData.sort((a, b) => a.price - b.price);
        } else if (sortBy === 'price_desc') {
            displayData.sort((a, b) => b.price - a.price);
        } else if (sortBy === 'sales') {
            displayData.sort((a, b) => b.sales - a.sales);
        } else if (sortBy === 'score') {
            displayData.sort((a, b) => b.system_score - a.system_score);
        }

        // 4. 檢查是否有結果
        if (displayData.length === 0) {
            monitorList.innerHTML = '<p class="status-msg">查無符合條件的螢幕</p>';
            return;
        }

        // 5. 渲染成 HTML 卡片
        monitorList.innerHTML = displayData.map(monitor => `
            <div class="monitor-card">
                <div class="rank-badge">2026 排名 #${monitor.rank_2026}</div>
                
                <div class="card-body">
                    <h3 class="card-title">${monitor.name}</h3>
                    <p class="card-subtitle">${monitor.panel} | ${monitor.resolution} | ${monitor.refresh_rate}</p>
                    
                    <div class="specs-badge-container">
                        <div class="spec-item"><span>尺寸</span><span class="spec-size">${monitor.size} 吋</span></div>
                        <div class="spec-item"><span>月銷量</span><span class="spec-sales">${monitor.sales.toLocaleString()} 筆</span></div>
                        <div class="spec-item"><span>評分</span><span class="spec-score">${monitor.system_score}分</span></div>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="price-box">
                        <span>促銷價</span>
                        <span class="price-value">NT$ ${monitor.price.toLocaleString()}</span>
                    </div>
                    <button class="btn-detail">查看評測</button>
                </div>
            </div>
        `).join('');
    }

    // 網頁開啟時改為觸發 loadData
    window.onload = loadData;
</script>
